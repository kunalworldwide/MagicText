name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      # swift test only compiles the core module and its tests — build the
      # full package (including the app executable) so a broken app target
      # can never reach a release tag.
      - name: Build app target (debug)
        run: swift build

  release:
    name: Build DMG & Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app + DMG
        run: bash scripts/build-app.sh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/MagicText-*-macOS.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}